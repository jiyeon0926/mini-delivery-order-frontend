<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="/assets/js/color-modes.js"></script>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/css/common.css" rel="stylesheet" />
    <title>메뉴 관리</title>

    <style>
        /* 사이드바 */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: #f8f9fa;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        /* 토글 버튼 */
        .btn-toggle {
            display: flex;
            align-items: center;
            width: 100%;
            font-weight: 600;
            color: #333;
            background: none;
            border: none;
            padding: 10px;
        }

        .btn-toggle:hover {
            background: #e9ecef;
        }

        /* 화살표 */
        .btn-toggle::before {
            content: "›";
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .btn-toggle[aria-expanded="true"]::before {
            transform: rotate(90deg);
        }

        /* 내부 메뉴 */
        .btn-toggle-nav a {
            display: block;
            padding: 6px 20px;
            color: #555;
            text-decoration: none;
        }

        .btn-toggle-nav a:hover {
            background: #e9ecef;
            border-radius: 5px;
        }

        /* offcanvas(오른쪽 메뉴) 아래 우측에 회원탈퇴 고정 */
        .offcanvas-body {
            display: flex;
            flex-direction: column;
        }

        /* 메뉴 관리 레이아웃 (Figma처럼 가운데 넓게) */
        .menu-wrap {
            max-width: 920px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .edit-btn,
        .save-btn,
        .menu-kill-btn {
            min-width: 120px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/owner/owner-main.html">Eat Now</a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <!-- 햄버거 -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="navbarMenu"
                aria-labelledby="navbarMenuLabel">
                <div class="offcanvas-header">
                    <div class="d-flex flex-column">
                        <h5 class="offcanvas-title mb-0" id="nickname"></h5>
                        <div class="small text-white-50" id="email"></div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/user/nickname.html">닉네임 변경</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/user/password.html">비밀번호 변경</a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="logoutBtn">
                                로그아웃
                            </button>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">내 가게</a>
                        </li>
                    </ul>

                    <div class="mt-auto d-flex justify-content-end">
                        <button class="btn btn-link btn-sm text-danger p-0" id="deleteAccountBtn" type="button">
                            회원탈퇴
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <!-- 사이드 바 -->
        <div class="sidebar">
            <ul class="list-unstyled store-side" id="storeSideAccordion">
            </ul>
        </div>
        <main class="flex-grow-1 ps-5 py-5">
            <div class="container-fluid">
                <div class="menu-wrap">
                    <div class="menu-list">
                    </div>
                    <button class="btn btn-light border w-100 mt-4 py-3 fw-bold" id="addMenuBtn" type="button">
                        + 새 메뉴 등록
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>
    <script>
        const storeId = new URLSearchParams(window.location.search).get(
            "storeId",
        );
        function loadProfile() {
            profileAPI().done(function (response) {
                const nickname = response.data.nickname;
                const email = response.data.email;

                $("#nickname").text(nickname);
                $("#email").text(email);
            })
        }

        function renderStoreSide(data) {

            const openIdx = getOwnerSidebarOpenIndex(data, storeId);
            const sideHtml = data
                .map(
                    (d, idx) => {
                        const collapseId = `store-side-${d.id}`;
                        const isOpen = idx === openIdx;
                        return `
                    <li>
                    <button class="btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="${isOpen}">
                        ${d.name}
                    </button>
                    <div class="collapse${isOpen ? " show" : ""}" id="${collapseId}" data-bs-parent="#storeSideAccordion">
                        <ul class="btn-toggle-nav list-unstyled small">
                            <li><a href="/pages/owner/owner-quick.html?storeId=${d.id}">대시보드</a></li>
                            <li><a href="/pages/owner/owner-store-manage.html?storeId=${d.id}">가게 관리</a></li>
                            <li><a href="/pages/owner/owner-order-manage.html?storeId=${d.id}">주문 관리</a></li>
                            <li><a href="/pages/owner/owner-review-manage.html?storeId=${d.id}">리뷰 관리</a></li>
                            <li><a href="/pages/owner/owner-menu-manage.html?storeId=${d.id}">메뉴 관리</a></li>
                        </ul>
                    </div>
                </li>
                `;
                    },
                )
                .join("");

            $(".store-side").html(sideHtml);
            highlightOwnerSidebarNav();
        }

        function loadStores() {
            myStoresAPI().done(function (response) {
                const data = response.data;

                renderStoreSide(data);
            });
        }

        function menuCardHtml(m, { isNew = false } = {}) {
            const menuId = m?.menuId ?? m?.id ?? "";
            const menuName = m?.menuName ?? m?.name ?? "";
            const priceNum = typeof m?.price === "number" ? m.price : null;

            return `
              <div class="card ${isNew ? "is-new" : ""}" data-menu-id="${menuId}">
                <div class="card-body d-flex justify-content-between align-items-center gap-3">
                  <div>
                    <input
                      type="text"
                      class="form-control text-dark fw-bold mb-1 menu-name"
                      value="${menuName}"
                      ${isNew ? "" : "disabled"}
                      style="background:transparent; border:none; width:350px"
                    />

                    <input
                      type="text"
                      class="form-control text-dark text-muted small menu-price"
                      value="${priceNum === null ? "" : priceNum.toLocaleString()}"
                      ${isNew ? "" : "disabled"}
                      style="background:transparent; border:none; text-align:right; width:90px"
                    />
                  </div>

                  <div class="ps-4 d-flex flex-column align-items-end gap-2">
                    <button class="btn btn-primary btn-sm edit-btn ${isNew ? "d-none" : ""}">수정</button>
                    <button class="btn btn-primary btn-sm save-btn ${isNew ? "" : "d-none"}">저장</button>
                    <button class="btn btn-danger btn-sm menu-action-btn menu-kill-btn" type="button">
                      메뉴 삭제
                    </button>
                  </div>
                </div>
              </div>
            `;
        }

        function renderMenus(menus) {
            const menuListHtml = menus.map((m) => menuCardHtml(m)).join("");
            $(".menu-list").html(menuListHtml);
        }

        function loadMenus() {
            storeDetailAPI(storeId)
                .done(function (response) {
                    renderMenus(response.data.menus);
                })
                .fail(function () {
                    $(".menu-list").html(
                        "<p class='text-center'>메뉴 정보가 없습니다.</p>",
                    );
                });
        }

        $(document).ready(function () {
            loadProfile();
            loadStores();
            loadMenus();
        });

        $("#addMenuBtn").on("click", function () {
            const existingNew = $(".menu-list .card.is-new").first();
            if (existingNew.length) {
                existingNew.find(".menu-name").focus();
                return;
            }

            const emptyMenu = { menuId: "", menuName: "", price: null };
            const html = menuCardHtml(emptyMenu, { isNew: true });

            $(".menu-list").prepend(html);

            const newCard = $(".menu-list .card").first();
            newCard.find(".menu-name").focus();
        });

        $(".menu-list").on("click", ".edit-btn", function () {
            const item = $(this).closest(".card");

            item.find("input").prop("disabled", false);
            item.find(".edit-btn").addClass("d-none");
            item.find(".save-btn").removeClass("d-none");
            item.find(".menu-name").focus();
        });

        $(".menu-list").on("click", ".save-btn", function () {
            const item = $(this).closest(".card");
            const menuId = item.data("menu-id");
            const menuNameRaw = item.find(".menu-name").val();
            const menuPriceRaw = item.find(".menu-price").val();

            const menuName = String(menuNameRaw ?? "").trim();
            const priceNum = parseInt(String(menuPriceRaw ?? "").replace(/,/g, ""), 10);

            if (!menuName) {
                alert("메뉴명을 입력해주세요.");
                item.find(".menu-name").focus();
                return;
            }

            if (!Number.isFinite(priceNum) || priceNum < 0) {
                alert("가격을 올바르게 입력해주세요.");
                item.find(".menu-price").focus();
                return;
            }

            const data = { name: menuName, price: priceNum };
            const req = menuId ? updateMenuAPI(storeId, menuId, data) : addMenuAPI(storeId, data);

            req
                .done(function () {
                    // 성공했을 때만 UI 잠그고, 목록을 서버 기준으로 갱신
                    item.find("input").prop("disabled", true);
                    item.find(".edit-btn").removeClass("d-none");
                    item.find(".save-btn").addClass("d-none");
                    item.removeClass("is-new");

                    loadMenus();
                })
                .fail(function (xhr) {
                    const msg = xhr?.responseJSON?.message;
                    alert(msg ?? "메뉴를 저장할 수 없습니다.");
                });
        });

        $(".menu-list").on("click", ".menu-kill-btn", function () {
            const isOk = confirm("정말로 삭제 하시겠습니까?");
            if (!isOk) {
                return;
            }

            const menu = $(this).closest(".card");
            const menuId = menu.data("menu-id");
            if (!menuId) {
                // 서버에 아직 생성되지 않은 신규 카드라면 DOM에서만 제거
                menu.remove();
                return;
            }

            deleteMenuAPI(storeId, menuId)
                .done(function () {
                    alert("삭제되었습니다.");
                    window.location.href = "/pages/owner/owner-menu-manage.html";
                })
                .fail(function (xhr) {
                    const msg = xhr?.responseJSON?.message;
                    alert(msg);
                });
        });
    </script>
</body>

</html>
