<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="/assets/js/color-modes.js"></script>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/css/common.css" rel="stylesheet" />
    <title>지점 메인 대시보드</title>

    <style>
      /* 사이드바 */
      .sidebar {
        width: 280px;
        height: 100vh;
        background: #f8f9fa;
        padding: 20px;
        border-right: 1px solid #ddd;
      }

      /* 토글 버튼 */
      .btn-toggle {
        display: flex;
        align-items: center;
        width: 100%;
        font-weight: 600;
        color: #333;
        background: none;
        border: none;
        padding: 10px;
      }

      .btn-toggle:hover {
        background: #e9ecef;
      }

      /* 화살표 */
      .btn-toggle::before {
        content: "›";
        margin-right: 10px;
        transition: transform 0.2s;
      }

      .btn-toggle[aria-expanded="true"]::before {
        transform: rotate(90deg);
      }

      /* 내부 메뉴 */
      .btn-toggle-nav a {
        display: block;
        padding: 6px 20px;
        color: #555;
        text-decoration: none;
      }

      .btn-toggle-nav a:hover {
        background: #e9ecef;
        border-radius: 5px;
      }

      .quick-menu .quick-col {
        max-width: 320px;
        /* 카드 폭: 원하는 값으로 조절 */
      }

      .quick-menu .quick-card {
        border-radius: 12px;
      }

      /* offcanvas(오른쪽 메뉴) 아래 우측에 회원탈퇴 고정 */
      .offcanvas-body {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/pages/owner/owner-main.html">Eat Now</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <!-- 햄버거 -->
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
        <div
          class="offcanvas offcanvas-end text-bg-dark"
          tabindex="-1"
          id="navbarMenu"
          aria-labelledby="navbarMenuLabel"
        >
          <div class="offcanvas-header">
            <div class="d-flex flex-column">
              <h5 class="offcanvas-title mb-0" id="nickname"></h5>
              <div class="small text-white-50" id="email"></div>
            </div>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/pages/user/nickname.html"
                  >닉네임 변경</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/pages/user/password.html"
                  >비밀번호 변경</a
                >
              </li>
              <li class="nav-item">
                <button class="nav-link" id="logoutBtn">로그아웃</button>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">내 가게</a>
              </li>
            </ul>

            <div class="mt-auto d-flex justify-content-end">
              <button
                class="btn btn-link btn-sm text-danger p-0"
                id="deleteAccountBtn"
                type="button"
              >
                회원탈퇴
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="d-flex">
      <!-- 사이드 바 -->
      <div class="sidebar">
        <ul class="list-unstyled store-side" id="storeSideAccordion"></ul>
      </div>
      <!-- 퀵 메뉴 -->
      <main class="flex-grow-1 ps-5 py-5">
        <div
          class="quick-menu row row-cols-1 row-cols-lg-3 g-3 justify-content-center"
        >
          <div class="col quick-col">
            <div class="card quick-card h-100">
              <div class="card-body d-flex flex-column gap-2">
                <h5 class="card-title mb-0">가게 관리</h5>
                <div class="text-muted small">Quick Menu</div>
                <button
                  class="btn btn-primary btn-sm w-auto align-self-start px-3 mt-auto"
                  id="storeKillBtn"
                >
                  가게 폐업
                </button>
              </div>
            </div>
          </div>

          <div class="col quick-col">
            <div class="card quick-card h-100">
              <div class="card-body d-flex flex-column gap-2">
                <h5 class="card-title mb-0">주문 관리</h5>
                <div class="text-muted small">Quick Menu</div>
                <button
                  class="btn btn-primary btn-sm w-auto align-self-start px-3 mt-auto"
                  id="ordCancelReqBtn"
                >
                  주문 취소 요청
                </button>
              </div>
            </div>
          </div>

          <div class="col quick-col">
            <div class="card quick-card h-100">
              <div class="card-body d-flex flex-column gap-2">
                <h5 class="card-title mb-0">리뷰 관리</h5>
                <div class="text-muted small">Quick Menu</div>
                <a
                  href="#"
                  class="btn btn-primary btn-sm w-auto align-self-start px-3 mt-auto"
                  id="reviewLink"
                  >리뷰 관리</a
                >
              </div>
            </div>
          </div>
        </div>
        <!-- 메뉴 리스트 -->
        <div
          class="list-group mx-auto py-5"
          id="menuList"
          style="max-width: 100%"
        ></div>
      </main>
    </div>

    <script
      src="/assets/js/bootstrap.bundle.min.js"
      class="astro-vvvwv3sm"
    ></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const storeId = params.get("storeId");

      function loadProfile() {
        profileAPI().done(function (response) {
          const nickname = response.data.nickname;
          const email = response.data.email;

          $("#nickname").text(nickname);
          $("#email").text(email);
        });
      }

      function renderStoreSide(data) {
        const openIdx = getOwnerSidebarOpenIndex(data, storeId);
        const sideHtml = data
          .map((d, idx) => {
            const collapseId = `store-side-${d.id}`;
            const isOpen = idx === openIdx;
            return `
                    <li>
                    <button class="btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="${isOpen}">
                        ${d.name}
                    </button>
                    <div class="collapse${isOpen ? " show" : ""}" id="${collapseId}" data-bs-parent="#storeSideAccordion">
                        <ul class="btn-toggle-nav list-unstyled small">
                            <li><a href="/pages/owner/owner-quick.html?storeId=${d.id}">대시보드</a></li>
                            <li><a href="/pages/owner/owner-store-manage.html?storeId=${d.id}">가게 관리</a></li>
                            <li><a href="/pages/owner/owner-order-manage.html?storeId=${d.id}">주문 관리</a></li>
                            <li><a href="/pages/owner/owner-review-manage.html?storeId=${d.id}">리뷰 관리</a></li>
                            <li><a href="/pages/owner/owner-menu-manage.html?storeId=${d.id}">메뉴 관리</a></li>
                        </ul>
                    </div>
                </li>
                `;
          })
          .join("");

        $(".store-side").html(sideHtml);
        highlightOwnerSidebarNav();
      }

      function updateBtnState(selector, isDeleted) {
        const btn = $(selector);

        if (isDeleted) {
          btn
            .removeClass("btn-primary")
            .addClass("btn-secondary")
            .prop("disabled", true);
        } else if (!isDeleted) {
          btn
            .removeClass("btn-secondary")
            .addClass("btn-primary")
            .prop("disabled", false);
        }
      }

      function loadStores() {
        myStoresAPI().done(function (response) {
          const data = response.data;
          renderStoreSide(data);

          const currentStore = data.find((d) => d.id == storeId);
          if (currentStore) {
            const isDeleted = currentStore.deleted;
            updateBtnState("#storeKillBtn", isDeleted);
            updateBtnState("#ordCancelReqBtn", isDeleted);
          }
        });
      }

      function renderMenus(menus) {
        const menuListHtml = menus
          .map(
            (m) =>
              `
                <div 
                  class="list-group-item py-3 d-flex align-items-center justify-content-between" 
                  data-menu-id="${m.menuId}"
                >
                  <input
                    type="text" 
                    class="form-control text-dark fw-bold mb-1 menu-name" 
                    value="${m.menuName}" disabled 
                    style="background:transparent; border:none; width:350px"
                  >
                  
                  <div class="d-flex justify-content-end mt-2">
                    <input
                    type="text"
                    class="form-control text-dark text-muted small menu-price" 
                    value="${m.price.toLocaleString()}" disabled 
                    style="background:transparent; border:none; text-align:right; width:90px"
                  >
                  <div class="ps-4">
                    <button class="btn btn-primary btn-sm edit-btn">수정</button>
                    <button class="btn btn-primary btn-sm save-btn d-none save-btn">
                      저장
                    </button>
                    </div>
                  </div>
                </div>
            `,
          )
          .join("");

        $("#menuList").html(menuListHtml);
      }

      function loadMenus() {
        storeDetailAPI(storeId)
          .done(function (response) {
            renderMenus(response.data.menus);
          })
          .fail(function () {
            $("#menuList").html(
              "<p class='text-center'>메뉴 정보가 없습니다.</p>",
            );
          });
      }

      $(document).ready(function () {
        loadProfile();
        loadStores();
        loadMenus();
      });

      $("#storeKillBtn").on("click", function () {
        const isOk = confirm("정말로 폐업 하시겠습니까?");
        if (!isOk) {
          return;
        }

        storeKillAPI(storeId)
          .done(function () {
            alert("폐업되었습니다.");
            window.location.href = "/pages/owner/owner-main.html";
          })
          .fail(function (xhr) {
            const msg = xhr?.responseJSON?.message;
            alert(msg);
          });
      });

      $("#reviewLink").on("click", function () {
        $("#reviewLink").attr(
          "href",
          `/pages/owner/owner-review-manage.html?storeId=${storeId}`,
        );
      });

      $("#menuList").on("click", ".edit-btn", function () {
        const item = $(this).closest(".list-group-item");

        item.find("input").prop("disabled", false);
        item.find(".edit-btn").addClass("d-none");
        item.find(".save-btn").removeClass("d-none");
        item.find(".menu-name").focus();
      });

      $("#menuList").on("click", ".save-btn", function () {
        const item = $(this).closest(".list-group-item");
        const menuId = item.data("menu-id");
        const menuName = item.find(".menu-name").val();
        const menuPrice = item.find(".menu-price").val();

        const data = {
          name: menuName,
          price: parseInt(menuPrice.replace(/,/g, "")),
        };

        updateMenuAPI(storeId, menuId, data)
          .done(function () {
            loadMenus();
          })
          .fail(function () {
            alert("메뉴를 수정할 수 없습니다.");
          });

        item.find("input").prop("disabled", true);
        item.find(".edit-btn").removeClass("d-none");
        item.find(".save-btn").addClass("d-none");
      });
    </script>
  </body>
</html>
