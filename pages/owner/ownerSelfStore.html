<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="/assets/js/color-modes.js"></script>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/css/common.css" rel="stylesheet" />
    <title>사장 메인</title>

    <style>
        /* 사이드바 */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: #f8f9fa;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        /* 토글 버튼 */
        .btn-toggle {
            display: flex;
            align-items: center;
            width: 100%;
            font-weight: 600;
            color: #333;
            background: none;
            border: none;
            padding: 10px;
        }

        .btn-toggle:hover {
            background: #e9ecef;
        }

        /* 화살표 */
        .btn-toggle::before {
            content: "›";
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .btn-toggle[aria-expanded="true"]::before {
            transform: rotate(90deg);
        }

        /* 내부 메뉴 */
        .btn-toggle-nav a {
            display: block;
            padding: 6px 20px;
            color: #555;
            text-decoration: none;
        }

        .btn-toggle-nav a:hover {
            background: #e9ecef;
            border-radius: 5px;
        }

        /* offcanvas(오른쪽 메뉴) 아래 우측에 회원탈퇴 고정 */
        .offcanvas-body {
            display: flex;
            flex-direction: column;
        }

        /* 폐업된 가게 표시 */
        .store-item-deleted {
            background-color: #f8d7da; /* Bootstrap danger-subtle 유사 */
            border-color: #f1aeb5;
        }

        .store-item-deleted .store-name,
        .store-item-deleted .store-meta {
            text-decoration: line-through;
            text-decoration-color: #dc3545;
            text-decoration-thickness: 2px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/owner/owner-main.html">Eat Now</a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <!-- 햄버거 -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="navbarMenu"
                aria-labelledby="navbarMenuLabel">
                <div class="offcanvas-header">
                    <div class="d-flex flex-column">
                        <h5 class="offcanvas-title mb-0" id="nickname"></h5>
                        <div class="small text-white-50" id="email"></div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/user/nickname.html">닉네임 변경</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/user/password.html">비밀번호 변경</a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="logoutBtn">
                                로그아웃
                            </button>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/owner/ownerSelfStore.html">내 가게</a>
                        </li>
                    </ul>

                    <div class="mt-auto d-flex justify-content-end">
                        <button class="btn btn-link btn-sm text-danger p-0" id="deleteAccountBtn" type="button">
                            회원탈퇴
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <!-- 사이드 바 -->
        <div class="sidebar">
            <ul class="list-unstyled store-side" id="storeSideAccordion">
            </ul>
        </div>
        <main class="flex-grow-1 p-4">
            <div class="container-fluid h-100">
                <div class="row g-4 align-items-stretch">

                    <ul class="list-group" id="storeListGroup">

                    </ul>

                    <div class="d-grid mt-3">
                        <button class="btn btn-outline-secondary py-3" type="button" data-bs-toggle="modal"
                            data-bs-target="#createStoreModal" id="openCreateStoreModalBtn">
                            + 새 가게 생성
                        </button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- 새 가게 생성 모달 -->
    <div class="modal fade" id="createStoreModal" tabindex="-1" aria-labelledby="createStoreModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="createStoreModalLabel">새 가게 생성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="newStoreName">가게명</label>
                        <input class="form-control" id="newStoreName" type="text" placeholder="예) 홍대점" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="newStoreAddress">가게주소</label>
                        <input class="form-control" id="newStoreAddress" type="text" placeholder="예) 서울 ..." />
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="newStoreMinOrderAmount">최소주문금액</label>
                        <input class="form-control" id="newStoreMinOrderAmount" type="number" min="0"
                            placeholder="예) 12000" />
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-bold" for="newStoreOpenTime">여는 시간</label>
                            <input class="form-control" id="newStoreOpenTime" type="time" value="09:00" />
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold" for="newStoreCloseTime">닫는 시간</label>
                            <input class="form-control" id="newStoreCloseTime" type="time" value="22:00" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="createStoreBtn">생성</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/bootstrap.bundle.min.js" class="astro-vvvwv3sm"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>
    <script>
        function loadProfile() {
            profileAPI().done(function (response) {
                const nickname = response.data.nickname;
                const email = response.data.email;

                $("#nickname").text(nickname);
                $("#email").text(email);
            })
        }


        function renderStoreSide(data) {
            const urlStoreId = new URLSearchParams(window.location.search).get(
                "storeId",
            );
            const openIdx = getOwnerSidebarOpenIndex(data, urlStoreId);
            const sideHtml = data

                .map(
                    (d, idx) => {
                        const collapseId = `store-side-${d.id}`;
                        const isOpen = idx === openIdx;
                        return `
                    <li>
                    <button class="btn-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="${isOpen}">
                        ${d.name}
                    </button>
                    <div class="collapse${isOpen ? " show" : ""}" id="${collapseId}" data-bs-parent="#storeSideAccordion">
                        <ul class="btn-toggle-nav list-unstyled small">
                            <li><a href="/pages/owner/owner-quick.html?storeId=${d.id}">대시보드</a></li>
                            <li><a href="/pages/owner/owner-store-manage.html?storeId=${d.id}">가게 관리</a></li>
                            <li><a href="/pages/owner/owner-order-manage.html?storeId=${d.id}">주문 관리</a></li>
                            <li><a href="/pages/owner/owner-review-manage.html?storeId=${d.id}">리뷰 관리</a></li>
                            <li><a href="/pages/owner/owner-menu-manage.html?storeId=${d.id}">메뉴 관리</a></li>
                        </ul>
                    </div>
                </li>
                `;
                    },
                )
                .join("");

            $(".store-side").html(sideHtml);
            highlightOwnerSidebarNav();
        }

        function renderStores(data) {
            const storeListHtml = data
                .map((d) => {
                    const isDeleted = d.deleted === true;
                    const isOpen = d.storeStatus === "OPEN";
                    const statusLabel = isDeleted ? "폐업" : (isOpen ? "영업 중" : "영업 전");
                    const nextStatus = isOpen ? "CLOSE" : "OPEN";
                    const createdAt = d.createdAt ? formatDate(d.createdAt) : "";

                    return `
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3 ${isDeleted ? "store-item-deleted" : ""}">
                            <div class="d-flex flex-column gap-1">
                                <div class="store-name fw-bold fs-5">${d.name}</div>
                                <div class="store-meta small text-muted">${createdAt}</div>
                            </div>
                            <button
                                type="button"
                                class="btn btn-sm ${isDeleted ? "btn-secondary" : (isOpen ? "btn-dark" : "btn-outline-dark")} store-status-btn"
                                data-store-id="${d.id}"
                                data-next-status="${nextStatus}"
                                ${isDeleted ? "disabled" : ""}
                            >
                                ${statusLabel}
                            </button>
                        </li>
                    `;
                })
                .join("");

            $("#storeListGroup").html(storeListHtml);
        }

        function loadStores() {
            myStoresAPI().done(function (response) {
                const data = response.data;

                renderStoreSide(data);
                renderStores(data);
            });
        }

        $(document).ready(function () {
            loadProfile();
            loadStores();
        });

        $("#storeListGroup").on("click", ".store-status-btn", function () {
            const storeId = $(this).data("store-id");
            const storeStatus = $(this).data("next-status");

            updateStoreStatusAPI(storeId, { storeStatus })
                .done(function () {
                    loadStores();
                })
                .fail(function () {
                    alert("영업 상태를 변경할 수 없습니다.");
                    loadStores();
                });
        });

        function resetCreateStoreForm() {
            $("#newStoreName").val("");
            $("#newStoreAddress").val("");
            $("#newStoreMinOrderAmount").val("");
            $("#newStoreOpenTime").val("09:00");
            $("#newStoreCloseTime").val("22:00");
            $("#createStoreBtn").prop("disabled", false).text("생성");
        }

        $("#createStoreModal").on("shown.bs.modal", function () {
            $("#newStoreName").trigger("focus");
        });

        $("#createStoreModal").on("hidden.bs.modal", function () {
            resetCreateStoreForm();
        });

        $("#createStoreBtn").on("click", function () {
            const name = $("#newStoreName").val().trim();
            const address = $("#newStoreAddress").val().trim();
            const minOrderAmountRaw = $("#newStoreMinOrderAmount").val();
            const openTime = $("#newStoreOpenTime").val();
            const closeTime = $("#newStoreCloseTime").val();

            if (!name) {
                alert("가게명을 입력해주세요.");
                $("#newStoreName").trigger("focus");
                return;
            }
            if (!address) {
                alert("가게주소를 입력해주세요.");
                $("#newStoreAddress").trigger("focus");
                return;
            }
            if (!minOrderAmountRaw) {
                alert("최소주문금액을 입력해주세요.");
                $("#newStoreMinOrderAmount").trigger("focus");
                return;
            }

            const data = {
                name,
                address,
                minOrderAmount: Number(minOrderAmountRaw),
                openTime,
                closeTime,
            };

            $("#createStoreBtn").prop("disabled", true).text("생성 중...");
            createStoreAPI(data)
                .done(function (response) {
                    const createdId = response?.data?.id ?? response?.data?.storeId;
                    const modalEl = document.getElementById("createStoreModal");
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) {
                        modal.hide();
                    }

                    loadStores();

                    if (createdId != null) {
                        window.location.href = `/pages/owner/owner-store-manage.html?storeId=${createdId}`;
                    }
                })
                .fail(function (xhr) {
                    const msg =
                        xhr?.responseJSON?.message ||
                        xhr?.responseText ||
                        "가게를 생성할 수 없습니다.";
                    alert(msg);
                    $("#createStoreBtn").prop("disabled", false).text("생성");
                });
        });
    </script>
</body>

</html>
